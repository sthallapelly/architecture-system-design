<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#0b1525"/><style>text{font-family:Arial,sans-serif;fill:#eaf2ff}.title{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#a7b9d1}.box{fill:#142a45;stroke:#65a7e8;stroke-width:2;rx:14}.green{stroke:#64d6b0}.txt{font-size:20px;font-weight:600}.small{font-size:15px;fill:#c2d1e4}.line{stroke:#87baf1;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#87baf1"/></marker></defs><text class="title" x="55" y="64">Authorization and Revocation Are Separate from Indexing</text><text class="sub" x="55" y="94">The model never decides whether a user is entitled to protected content.</text><rect class="box " x="60" y="145" width="310" height="95"/><text class="txt" x="215.0" y="179" text-anchor="middle">ACL / Revocation Events</text><text class="small" x="215.0" y="205" text-anchor="middle">Priority change propagation</text><rect class="box green" x="445" y="145" width="310" height="95"/><text class="txt" x="600.0" y="179" text-anchor="middle">Authorization State</text><text class="small" x="600.0" y="205" text-anchor="middle">Current document and policy state</text><path class="line" d="M370 190 L445 190"/><rect class="box " x="60" y="355" width="310" height="95"/><text class="txt" x="215.0" y="389" text-anchor="middle">Retrieval Candidates</text><text class="small" x="215.0" y="415" text-anchor="middle">Potentially relevant document IDs</text><rect class="box green" x="445" y="355" width="310" height="95"/><text class="txt" x="600.0" y="389" text-anchor="middle">Authoritative Check</text><text class="small" x="600.0" y="415" text-anchor="middle">Identity + ACL + revocation</text><rect class="box green" x="830" y="355" width="310" height="95"/><text class="txt" x="985.0" y="389" text-anchor="middle">Authorized Context</text><text class="small" x="985.0" y="415" text-anchor="middle">Only allowed evidence</text><path class="line" d="M370 400 L445 400"/><path class="line" d="M755 400 L830 400"/><path class="line" d="M600 240 L600 355"/><text class="sub" x="600" y="510" text-anchor="middle">Fail closed when protected-content authorization cannot be verified</text></svg>