<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#0b1525"/><style>text{font-family:Arial,sans-serif;fill:#eaf2ff}.title{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#a7b9d1}.box{fill:#142a45;stroke:#65a7e8;stroke-width:2;rx:14}.green{stroke:#64d6b0}.txt{font-size:20px;font-weight:600}.small{font-size:15px;fill:#c2d1e4}.line{stroke:#87baf1;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#87baf1"/></marker></defs><text class="title" x="55" y="64">Hybrid Retrieval and Context Assembly</text><text class="sub" x="55" y="94">Candidate recall first; evidence precision and completeness afterward.</text><rect class="box " x="420" y="120" width="360" height="90"/><text class="txt" x="600.0" y="154" text-anchor="middle">Query + Authorization</text><text class="small" x="600.0" y="180" text-anchor="middle">Tenant, user and document constraints</text><rect class="box " x="140" y="265" width="380" height="95"/><text class="txt" x="330.0" y="299" text-anchor="middle">Vector Search</text><text class="small" x="330.0" y="325" text-anchor="middle">Semantic candidates · Top-K</text><rect class="box " x="680" y="265" width="380" height="95"/><text class="txt" x="870.0" y="299" text-anchor="middle">Lexical Search</text><text class="small" x="870.0" y="325" text-anchor="middle">Exact terms / identifiers · Top-K</text><path class="line" d="M515 210 L330 265"/><path class="line" d="M685 210 L870 265"/><rect class="box " x="420" y="410" width="360" height="90"/><text class="txt" x="600.0" y="444" text-anchor="middle">Fusion + Reranking</text><text class="small" x="600.0" y="470" text-anchor="middle">Deduplicate · combine · prioritize</text><path class="line" d="M330 360 L480 410"/><path class="line" d="M870 360 L720 410"/><rect class="box green" x="3