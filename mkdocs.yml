site_name: Architecture & System Design
site_description: A practical knowledge base for system design, distributed systems, software architecture, and cloud architecture.
site_author: Suman Thallapelly
site_url: https://sthallapelly.github.io/architecture-system-design/

repo_name: sthallapelly/architecture-system-design
repo_url: https://github.com/sthallapelly/architecture-system-design

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true

hooks:
  - hooks/external_links.py

plugins:
  - search

# Keep internal authoring resources and reference material out of the public build.
exclude_docs: |
  /reference/
  /contributing/
  /fundamentals/topic-template.md
  /patterns/pattern-template.md
  /problems/problem-template.md

nav:
  - Home: index.md

  - Architecture Domains:
      - System Design Fundamentals:
          - Overview: fundamentals/index.md
          - Requirements & Constraints: fundamentals/requirements.md
          - Scalability, Latency & Throughput: fundamentals/scalability-latency-throughput.md
          - Availability & Reliability: fundamentals/availability-reliability.md
          - Consistency Models: fundamentals/consistency.md

      - Distributed Systems:
          - Overview: distributed-systems/index.md

      - Cloud Architecture:
          - Overview: cloud/index.md
          - Secure Private Administrative Access:
                cloud/secure-private-administrative-access-aws.md

      - Application Architecture:
          - Microservices:
              - Overview: microservices/index.md
          - Multi-Tenant Architecture:
              - Overview: multi-tenancy/index.md

      - Integration & Event-Driven Architecture:
          - Event-Driven Architecture:
              - Overview: event-driven/index.md
          - Messaging Systems:
              - Overview: messaging/index.md
          - Streaming Systems:
              - Overview: streaming/index.md

      - Data Architecture:
          - Data & Databases:
              - Overview: databases/index.md
          - Caching:
              - Overview: caching/index.md

      - Reliability & Resilience:
          - Overview: reliability/index.md

      - Security Architecture:
          - Overview: security/index.md

      - AI Architecture:
          - Overview: genai/index.md

  - Architecture Patterns:
      - Overview: patterns/index.md
      - Transactional Outbox: patterns/transactional-outbox.md
      - Saga: patterns/saga.md
      - Circuit Breaker: patterns/circuit-breaker.md
      - Bulkhead: patterns/bulkhead.md
      - Strangler Fig: patterns/strangler.md
      - CQRS: patterns/cqrs.md

  - System Design Case Studies:
      - Overview: problems/index.md
      - Payment System: problems/payment-system.md
      - Notification System: problems/notification-system.md
      - Distributed Cache: problems/distributed-cache.md
      - Order Management: problems/order-management.md

  - Deep Dives:
      - Overview: deep-dives/index.md
      - Cloud Architecture:
          - Private Access to AWS Systems Manager: deep-dives/cloud-architecture/private-access-aws-systems-manager-deep-dive.md

  - Labs:
      - Overview: labs/index.md

extra:
  generator: false

copyright: "Architecture & System Design — Suman Thallapelly"
