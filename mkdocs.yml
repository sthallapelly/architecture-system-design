              - Browser Token and Session Architecture: security/browser-session-architecture.md
              - Gateway and API Enforcement Boundaries: security/gateway-api-enforcement.md
              - JWT Validation, Introspection, and Revocation: security/token-validation-revocation.md
              - Client Credentials and Machine Identity: security/client-credentials-machine-identity.md
              - Client Secrets, Private Key JWT, and mTLS: security/client-authentication-methods.md
              - Downstream Delegation and Token Exchange: security/downstream-delegation-token-exchange.md
              - "Sender-Constrained Tokens: mTLS and DPoP": security/sender-constrained-tokens.md
              - "Runtime Authorization: RBAC, ABAC, and ReBAC": security/runtime-authorization-models.md
              - Policy Decision and Enforcement Architecture: security/policy-decision-enforcement.md
              - Step-Up Authentication and Authentication Freshness: security/step-up-authentication.md
              - Continuous Access Evaluation and Shared Signals: security/continuous-access-evaluation.md
